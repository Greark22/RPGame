<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de Dados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--acc:#4f46e5;--accink:#fff;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--ink:#f3f4f6;--mut:#9ca3af;--line:#272b35;--acc:#7c74ff;--accink:#0f1115}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,sans-serif}
.hide{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{font-weight:700;letter-spacing:-.02em;font-size:1.1rem}
.me{display:flex;align-items:center;gap:10px}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.03em}
h2{font-size:1rem;margin:0 0 12px}
p{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.cols{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,.pick:focus-within{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:500;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--acc);color:var(--accink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--mut);padding:4px 6px}
button:disabled{opacity:.45;cursor:default}
.err{color:#e5484d;min-height:1.3em;margin:10px 0 0;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{background:none;color:var(--mut);padding:8px 12px}
.tabs button.on{background:var(--bg);color:var(--ink)}
.av{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--c,#999);color:#fff;font-weight:700;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--acc)}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:28px;height:28px;font-size:.8rem;box-shadow:none}
.av.xl{width:84px;height:84px;font-size:2rem}
.pick{display:block;width:84px;height:84px;margin:6px auto 0;cursor:pointer;position:relative;border-radius:50%}
.pick input{position:absolute;opacity:0;inset:0;cursor:pointer}
.pick .av{width:100%;height:100%;background:var(--line);color:var(--mut);box-shadow:none;font-size:1.7rem}
.cap{text-align:center;font-size:.85rem;color:var(--mut);margin-top:6px}
.who{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 12px 3px 3px;border:1px solid var(--line);border-radius:30px;font-size:.9rem}
.dice{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.die{border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;text-align:center;border-top:4px solid var(--c)}
.die.on{background:color-mix(in srgb,var(--c) 14%,var(--card));border-color:var(--c)}
.die b{display:block;font-size:1.35rem;color:var(--c)}
.ctl{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px}
.ctl button{width:30px;height:30px;padding:0;border-radius:50%;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.ctl span{min-width:1.5em;font-weight:700}
.sel{color:var(--mut);font-size:.95rem}
#feed{display:flex;flex-direction:column;max-height:50vh;overflow:auto}
.roll{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.roll:last-child{border:0}
.roll .t{font-weight:500}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;color:var(--mut);font-size:.85rem}
.pill{min-width:30px;text-align:center;padding:2px 8px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;font-size:.95rem}
.sum{display:flex;gap:16px;margin-top:8px;font-size:1.05rem}
.sum b{font-size:1.35rem}
.sum .mx b{color:var(--acc)}
.empty{color:var(--mut)}
</style>
</head>
<body>
<header id="top" class="hide">
  <div class="brand">Mesa de Dados</div>
  <div class="me"><span id="meav"></span><span id="mename"></span><button class="link" id="logout">Sair</button></div>
</header>
<main>
  <section id="auth" class="hide">
    <h1>Mesa de Dados</h1>
    <p>Entre para rolar dados com seus amigos.</p>
    <div class="card" style="max-width:380px">
      <div class="tabs"><button id="tlogin" class="on">Entrar</button><button id="tnew">Criar conta</button></div>
      <div id="photobox" class="hide">
        <label class="pick" aria-label="Escolher foto de perfil"><span id="pickav" class="av">+</span><input type="file" id="file" accept="image/*"></label>
        <div class="cap">Foto de perfil (opcional)</div>
      </div>
      <label for="un">Nome de usuário</label>
      <input type="text" id="un" maxlength="20" autocomplete="username">
      <label for="pw">Senha</label>
      <input type="password" id="pw" maxlength="40" autocomplete="current-password">
      <div class="row"><button id="go">Entrar</button></div>
      <p class="err" id="aerr" role="alert"></p>
    </div>
  </section>

  <section id="home" class="hide">
    <h1>Olá, <span id="hname"></span></h1>
    <p>Crie uma sala ou entre em uma. Até 8 jogadores.</p>
    <div class="cols">
      <div class="card">
        <h2>Criar sala</h2>
        <label for="rname">Nome da sala</label>
        <input type="text" id="rname" maxlength="24" placeholder="taverna-do-dragao">
        <label for="rpw">Senha (opcional)</label>
        <input type="password" id="rpw" maxlength="30" autocomplete="new-password">
        <div class="row"><button id="create">Criar sala</button></div>
      </div>
      <div class="card">
        <h2>Entrar em uma sala</h2>
        <label for="jname">Nome da sala</label>
        <input type="text" id="jname" maxlength="24">
        <div id="pwbox" class="hide"><label for="jpw">Senha da sala</label><input type="password" id="jpw" maxlength="30" autocomplete="off"></div>
        <div class="row"><button id="join">Entrar</button></div>
      </div>
    </div>
    <p class="err" id="herr" role="alert"></p>
  </section>

  <section id="room" class="hide">
    <div class="card">
      <div class="bar"><h2 id="rtitle" style="margin:0"></h2>
        <div class="row" style="margin:0"><button class="ghost" id="copy">Copiar link</button><button class="ghost" id="leave">Sair da sala</button></div></div>
      <div class="who" id="who" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h2>Dados</h2>
      <div class="dice" id="dice"></div>
      <div class="row"><button id="roll" disabled>Rolar</button><button class="ghost" id="clear">Limpar</button><span class="sel" id="sel">Nenhum dado selecionado</span></div>
    </div>
    <div class="card">
      <h2>Rolagens</h2>
      <div id="feed"><p class="empty" id="none">Nenhuma rolagem ainda.</p></div>
    </div>
  </section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,get,set,update,push,remove,onValue,onChildAdded,onDisconnect,query,limitToLast} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ====== COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE ====== */
const cfg={
  apiKey:"AIzaSyANEYfQYZJQwz5Vhl08DGQa4xOv9CnkKJU",
  authDomain:"rpgame-44db9.firebaseapp.com",
  databaseURL:"https://rpgame-44db9-default-rtdb.firebaseio.com",
  projectId:"rpgame-44db9",
  appId:"1:895635506100:web:8fe3730c0744a56377e8e1"
};
/* =============================================================== */

const DICE=[4,6,8,10,12,20,100],MAXQ=20,MAXP=8;
const COL={4:'#ef6a5b',6:'#f0a431',8:'#4cb782',10:'#2fb5b0',12:'#4f86f7',20:'#8b6cf0',100:'#e0589c'};
const HUES=Object.values(COL);
const $=id=>document.getElementById(id);
const slug=s=>s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const rand=n=>1+crypto.getRandomValues(new Uint32Array(1))[0]%n;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const show=id=>{['auth','home','room'].forEach(s=>$(s).classList.toggle('hide',s!==id));$('top').classList.toggle('hide',id==='auth')};
const JPG=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;

function av(photo,name,cls=''){
  const d=document.createElement('span');d.className='av '+cls;
  let h=0;for(const ch of String(name||'?'))h=(h*31+ch.charCodeAt(0))%HUES.length;
  d.style.setProperty('--c',HUES[h]);
  if(photo&&JPG.test(photo)){const i=document.createElement('img');i.src=photo;i.alt='';d.appendChild(i)}
  else d.textContent=String(name||'?').trim().charAt(0).toUpperCase();
  return d;
}
function resize(file){return new Promise((ok,no)=>{
  const im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);URL.revokeObjectURL(im.src);ok(c.toDataURL('image/jpeg',.8))};
  im.onerror=no;im.src=URL.createObjectURL(file)})}

if(cfg.apiKey==='COLE_AQUI'){show('auth');$('aerr').textContent='Falta colar a configuração do Firebase no index.html.';throw new Error('Firebase não configurado')}
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);
let uid=null,prof={name:'',photo:''},room=null,qty={},mode='login',photo='',registering=false;

/* ---------- login / cadastro ---------- */
function setMode(m){
  mode=m;$('tlogin').classList.toggle('on',m==='login');$('tnew').classList.toggle('on',m==='new');
  $('photobox').classList.toggle('hide',m!=='new');$('go').textContent=m==='new'?'Criar conta':'Entrar';
  $('pw').autocomplete=m==='new'?'new-password':'current-password';$('aerr').textContent='';
}
$('tlogin').onclick=()=>setMode('login');$('tnew').onclick=()=>setMode('new');
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{photo=await resize(f);const n=av(photo,'',''),p=$('pickav');p.textContent='';p.appendChild(n.firstChild)}catch(x){$('aerr').textContent='Não foi possível ler essa imagem.'}
};
const authMsg=e=>({'auth/email-already-in-use':'Esse nome já está em uso.','auth/invalid-credential':'Nome ou senha incorretos.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/network-request-failed':'Sem conexão. Tente novamente.','auth/operation-not-allowed':'Ative o login por E-mail/Senha no Firebase.'}[e.code]||'Erro: '+(e.code||e.message));
$('go').onclick=async()=>{
  const name=$('un').value.trim(),pw=$('pw').value;
  if(!name){$('aerr').textContent='Digite seu nome de usuário.';return}
  if(!pw){$('aerr').textContent='Digite a senha.';return}
  $('go').disabled=true;$('aerr').textContent='';
  try{
    const key=name.toLowerCase();
    const email=(await sha('u:'+key)).slice(0,40)+'@mesadados.app';
    const fpw=await sha('p:'+key+':'+pw);
    if(mode==='new'){
      registering=true;
      const c=await createUserWithEmailAndPassword(auth,email,fpw);
      prof={name:name.slice(0,20),photo};
      await set(ref(db,'users/'+c.user.uid),prof);
      registering=false;await start(c.user);
    }else await signInWithEmailAndPassword(auth,email,fpw);
  }catch(e){registering=false;$('aerr').textContent=authMsg(e)}
  $('go').disabled=false;
};
$('logout').onclick=async()=>{await leave();await signOut(auth)};
onAuthStateChanged(auth,async u=>{if(registering)return;if(!u){uid=null;show('auth');return}await start(u)});

async function start(u){
  uid=u.uid;
  const v=(await get(ref(db,'users/'+uid))).val();
  prof=v||{name:'Jogador',photo:''};
  $('mename').textContent=prof.name;$('hname').textContent=prof.name;
  $('meav').textContent='';$('meav').appendChild(av(prof.photo,prof.name,'s'));
  show('home');
  const q=new URLSearchParams(location.search).get('sala');if(q)$('jname').value=q;
}

/* ---------- salas ---------- */
const herr=m=>{$('herr').textContent=m||''};
async function joinRoom(code,pw){
  const meta=(await get(ref(db,`rooms/${code}/meta`))).val();
  if(!meta)throw'Sala não encontrada. Confira o nome.';
  let proof='-';
  if(meta.locked){
    if(!pw){$('pwbox').classList.remove('hide');throw'Esta sala tem senha. Digite-a para entrar.'}
    proof=await sha(code+':'+pw);
  }
  const ms=(await get(ref(db,`rooms/${code}/members`))).val()||{};
  if(!ms[uid]&&Object.keys(ms).length>=MAXP)throw'Sala cheia (máximo de 8 jogadores).';
  const mr=ref(db,`rooms/${code}/members/${uid}`);
  try{await set(mr,{name:prof.name,photo:prof.photo||'',proof})}
  catch(e){if(meta.locked)$('pwbox').classList.remove('hide');throw meta.locked?'Senha incorreta.':'Não foi possível entrar na sala.'}
  onDisconnect(mr).remove();
  room={code,mr,members:{},unsubs:[]};
  $('rtitle').textContent=String(meta.title||code).slice(0,40)+(meta.locked?' 🔒':'');
  room.unsubs.push(onValue(ref(db,`rooms/${code}/members`),s=>{room.members=s.val()||{};renderMembers()}));
  room.unsubs.push(onChildAdded(query(ref(db,`rooms/${code}/rolls`),limitToLast(50)),s=>addRoll(s.val())));
  show('room');
}
$('create').onclick=async()=>{
  herr('');const title=$('rname').value.trim(),code=slug(title),pw=$('rpw').value;
  if(!code){herr('Dê um nome para a sala.');return}
  $('create').disabled=true;
  try{
    if((await get(ref(db,`rooms/${code}/meta`))).exists())throw'Já existe uma sala com esse nome.';
    const up={[`rooms/${code}/meta`]:{title,owner:uid,locked:!!pw}};
    if(pw)up[`rooms/${code}/secret`]=await sha(code+':'+pw);
    await update(ref(db),up);
    await joinRoom(code,pw);
  }catch(e){herr(typeof e==='string'?e:'Erro: '+(e.code||e.message))}
  $('create').disabled=false;
};
$('join').onclick=async()=>{
  herr('');const code=slug($('jname').value);
  if(!code){herr('Digite o nome da sala.');return}
  $('join').disabled=true;
  try{await joinRoom(code,$('jpw').value)}catch(e){herr(typeof e==='string'?e:'Erro: '+(e.code||e.message))}
  $('join').disabled=false;
};
async function leave(){
  if(!room)return;
  const r=room;room=null;r.unsubs.forEach(f=>f());
  try{await onDisconnect(r.mr).cancel();await remove(r.mr)}catch(e){}
  $('feed').querySelectorAll('.roll').forEach(n=>n.remove());$('none').classList.remove('hide');
  if(uid)show('home');
}
$('leave').onclick=leave;
$('copy').onclick=()=>{
  if(!room)return;
  navigator.clipboard.writeText(location.origin+location.pathname+'?sala='+encodeURIComponent(room.code)).then(()=>{$('copy').textContent='Copiado!';setTimeout(()=>$('copy').textContent='Copiar link',1600)});
};
function renderMembers(){
  const box=$('who');box.textContent='';
  const list=Object.entries(room.members);
  list.forEach(([id,m])=>{
    const c=document.createElement('span');c.className='chip';
    c.appendChild(av(m.photo,m.name,'s'));
    c.appendChild(document.createTextNode(String(m.name||'?').slice(0,20)+(id===uid?' (você)':'')));
    box.appendChild(c);
  });
  const n=document.createElement('span');n.className='chip';n.style.paddingLeft='12px';n.textContent=list.length+' / '+MAXP;box.appendChild(n);
}

/* ---------- dados ---------- */
function buildDice(){
  const g=$('dice');g.textContent='';
  DICE.forEach(s=>{
    qty[s]=0;
    const el=document.createElement('div');el.className='die';el.style.setProperty('--c',COL[s]);
    el.innerHTML='<b>d'+s+'</b><div class="ctl"><button aria-label="Menos d'+s+'">−</button><span>0</span><button aria-label="Mais d'+s+'">+</button></div>';
    const [m,p]=el.querySelectorAll('button'),sp=el.querySelector('span');
    el._set=v=>{qty[s]=Math.max(0,Math.min(MAXQ,v));sp.textContent=qty[s];el.classList.toggle('on',qty[s]>0);upd()};
    m.onclick=()=>el._set(qty[s]-1);p.onclick=()=>el._set(qty[s]+1);
    g.appendChild(el);
  });
}
function upd(){
  const t=DICE.filter(s=>qty[s]).map(s=>qty[s]+'d'+s);
  $('sel').textContent=t.length?t.join(' + '):'Nenhum dado selecionado';$('roll').disabled=!t.length;
}
$('clear').onclick=()=>document.querySelectorAll('.die').forEach(d=>d._set(0));
$('roll').onclick=()=>{
  if(!room)return;
  const res={};let total=0,max=0,cnt=0;
  DICE.forEach(s=>{if(!qty[s])return;res['d'+s]=Array.from({length:qty[s]},()=>rand(s));res['d'+s].forEach(v=>{total+=v;max=Math.max(max,v);cnt++})});
  if(!cnt)return;
  push(ref(db,`rooms/${room.code}/rolls`),{uid,name:prof.name,res,total,max,cnt,ts:Date.now()});
};
function addRoll(e){
  if(!e||typeof e!=='object'||!e.res)return;
  $('none').classList.add('hide');
  const box=document.createElement('div');box.className='roll';
  const m=room&&room.members[e.uid];
  box.appendChild(av(m&&m.photo,e.name,'s'));
  const body=document.createElement('div');
  const t=document.createElement('div');t.className='t';t.textContent=String(e.name||'?').slice(0,20)+' rolou';body.appendChild(t);
  DICE.forEach(s=>{
    const arr=e.res['d'+s];if(!arr)return;
    const g=document.createElement('div');g.className='grp';
    const l=document.createElement('span');l.textContent=Object.keys(arr).length+'d'+s;g.appendChild(l);
    Object.values(arr).forEach(v=>{const p=document.createElement('span');p.className='pill';p.style.setProperty('--c',COL[s]);p.textContent=Number(v);g.appendChild(p)});
    body.appendChild(g);
  });
  const sum=document.createElement('div');sum.className='sum';
  const many=Number(e.cnt)>1;
  sum.innerHTML=(many?'<span>Total <b></b></span><span class="mx">Maior <b></b></span>':'<span>Resultado <b></b></span>');
  const bs=sum.querySelectorAll('b');bs[0].textContent=Number(e.total);if(many)bs[1].textContent=Number(e.max);
  body.appendChild(sum);box.appendChild(body);
  const f=$('feed');f.prepend(box);
  while(f.querySelectorAll('.roll').length>50)f.querySelector('.roll:last-of-type').remove();
}
buildDice();
</script>
</body>
</html>
